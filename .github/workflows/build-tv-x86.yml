name: Build Experience UI TV x86_64 ISO

on:
  workflow_dispatch:
  push:
    branches: [main, master, rebuild/functional-system-apps]
    paths:
      - ".github/workflows/build-tv-x86.yml"
      - "launcher/**"
      - "core-ui/**"
      - "settings/**"
      - "setupwizard/**"
      - "notes/**"
      - "clock/**"
      - "calendar/**"
      - "calculator/**"
      - "files/**"
      - "gallery/**"
      - "converter/**"
      - "ota-updater/**"
      - "bootanimation/**"
      - "settings.gradle.kts"
      - "build.gradle.kts"

permissions:
  contents: read

concurrency:
  group: experience-ui-tv-x86-optimized-64-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-tv:
    name: Build TV apps and repack Android TV ISO
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      BASE_ISO_URL: https://downloads.sourceforge.net/project/lineageos-tv-x86/lineage-21.0/x86_64_tv/lineage-21.0-20260331-UNOFFICIAL-x86_64_tv-signed.iso
      BASE_ISO_NAME: lineage-21.0-20260331-UNOFFICIAL-x86_64_tv-signed.iso
      BUILD_TOOLS_VERSION: "35.0.0"

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Configure Android SDK
        shell: bash
        run: |
          set -Eeuo pipefail
          SDK_ROOT="/usr/local/lib/android/sdk"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print -quit)"
          [[ -x "$SDKMANAGER" ]] || { echo "::error::Android sdkmanager not found"; exit 1; }
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          test -x "$SDK_ROOT/build-tools/35.0.0/aapt"
          test -x "$SDK_ROOT/build-tools/35.0.0/apksigner"

      - name: Install ISO tools and build current EROFS utilities
        shell: bash
        run: |
          set -Eeuo pipefail
          # Ubuntu 24.04 ships an older fsck.erofs that only validates EROFS;
          # it does not support extraction to a destination directory. Build
          # the current stable erofs-utils so --extract=DIR and xattrs work.
          sudo apt-get update
          sudo apt-get install -y xorriso e2fsprogs file unzip attr \
            autoconf automake gcc make libfuse-dev liblz4-dev liblzma-dev \
            libtool libzstd-dev pkg-config uuid-dev zlib1g-dev
          mkdir -p work
          git clone --depth 1 --branch master https://github.com/erofs/erofs-utils.git work/erofs-utils
          cd work/erofs-utils
          ./autogen.sh
          ./configure --enable-lz4 --enable-lzma --enable-fuse --with-libzstd --with-uuid
          make -j"$(nproc)"
          sudo make install
          sudo ldconfig
          FSCK_EROFS="$(command -v fsck.erofs)"
          echo "FSCK_EROFS=$FSCK_EROFS" >> "$GITHUB_ENV"
          echo "Using fsck.erofs at: $FSCK_EROFS"
          "$FSCK_EROFS" --version
          "$FSCK_EROFS" --help 2>&1 | tee "$GITHUB_WORKSPACE/dist-erofs-help.txt"
          grep -Eq -- '--extract(=|\[=)' "$GITHUB_WORKSPACE/dist-erofs-help.txt"

      - name: Build only TV-relevant Experience UI apps
        shell: bash
        run: |
          set -Eeuo pipefail
          # Phone-only dialer, contacts, messaging and camera modules are intentionally excluded.
          modules=(launcher settings setupwizard notes clock calendar calculator files gallery converter ota-updater)
          gradle_tasks=()
          for module in "${modules[@]}"; do gradle_tasks+=(":$module:assembleDebug"); done
          # Do not compile phone-only app modules for the TV image.
          gradle --no-daemon --stacktrace "${gradle_tasks[@]}"
          mkdir -p dist/apks
          for module in "${modules[@]}"; do
            apk="$module/build/outputs/apk/debug/$module-debug.apk"
            [[ -s "$apk" ]] || { echo "::error::Missing TV APK: $apk"; exit 1; }
            cp "$apk" "dist/apks/Experience-$module.apk"
          done
          test "$(find dist/apks -maxdepth 1 -type f -name '*.apk' | wc -l)" -eq "${#modules[@]}"
          printf '%s\n' "${modules[@]}" > dist/metadata-tv-app-modules.txt
          ls -lh dist/apks

      - name: Validate TV APKs
        shell: bash
        run: |
          set -Eeuo pipefail
          AAPT="$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION/aapt"
          APKSIGNER="$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION/apksigner"
          for apk in dist/apks/*.apk; do
            "$AAPT" dump badging "$apk" >/dev/null
            "$APKSIGNER" verify "$apk"
            unzip -t "$apk" >/dev/null
          done

      - name: Generate and validate boot animation
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m venv .venv
          .venv/bin/pip install --disable-pip-version-check Pillow
          .venv/bin/python bootanimation/generate_bootanimation.py
          test -s bootanimation/bootanimation.zip
          unzip -t bootanimation/bootanimation.zip
          python3 - <<'PY'
          import zipfile
          with zipfile.ZipFile("bootanimation/bootanimation.zip") as z:
              names = z.namelist()
              assert "desc.txt" in names
              assert any(n.startswith("part0/") and n.endswith(".png") for n in names)
              print("Validated boot animation:", z.read("desc.txt").decode().splitlines()[0])
          PY

      - name: Download and inspect upstream TV ISO
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p work/iso-root dist/metadata dist/image
          curl --fail --location --retry 4 --retry-all-errors --output base.iso "$BASE_ISO_URL"
          test -s base.iso
          file base.iso | tee dist/metadata/base-iso-file.txt
          grep -qi 'ISO 9660' dist/metadata/base-iso-file.txt
          sha256sum base.iso | tee dist/metadata/base-iso.sha256
          printf '%s\n' "$BASE_ISO_URL" > dist/metadata/base-iso-url.txt
          printf '%s\n' "$BASE_ISO_NAME" > dist/metadata/base-iso-filename.txt
          xorriso -osirrox on -indev base.iso -extract / work/iso-root
          find work/iso-root -maxdepth 3 -type f -printf '%p %s bytes\n' | sort > dist/metadata/iso-file-list.txt
          SYSTEM_IMAGE="$(find work/iso-root -maxdepth 2 -type f \( -name system.efs -o -name system.img -o -name system.sfs \) -print -quit)"
          [[ -n "$SYSTEM_IMAGE" ]] || { echo "::error::No system.efs/system.img/system.sfs found in upstream ISO"; exit 1; }
          echo "SYSTEM_IMAGE=$SYSTEM_IMAGE" >> "$GITHUB_ENV"
          file "$SYSTEM_IMAGE" | tee dist/metadata/system-image-file.txt
          grep -qi 'EROFS' dist/metadata/system-image-file.txt || { echo "::error::Expected an EROFS system image; refusing to modify unknown format"; exit 1; }
          fsck.erofs --help > dist/metadata/fsck-erofs-help.txt 2>&1 || true
          mkfs.erofs --help > dist/metadata/mkfs-erofs-help.txt 2>&1 || true

      - name: Extract EROFS and integrate TV apps
        shell: bash
        run: |
          set -Eeuo pipefail
          SYSTEM_IMAGE="$SYSTEM_IMAGE"
          SYSTEM_IMAGE_ABS="$PWD/$SYSTEM_IMAGE"
          EXTRACT_DIR="$PWD/work/system-root"
          sudo rm -rf "$EXTRACT_DIR"
          sudo mkdir -p "$EXTRACT_DIR"
          # Use the exact freshly-built binary by absolute path. Calling it via
          # sudo with only its name can select a different system-installed
          # fsck.erofs due to sudo's secure PATH.
          [[ -x "$FSCK_EROFS" ]] || { echo "::error::Built fsck.erofs binary missing: $FSCK_EROFS"; exit 1; }
          echo "EROFS image: $SYSTEM_IMAGE_ABS"
          file "$SYSTEM_IMAGE_ABS"
          "$FSCK_EROFS" --version
          # Use absolute input/output paths so extraction does not depend on
          # the current working directory. Capture verbose diagnostics on failure.
          if ! sudo "$FSCK_EROFS" -d 7 --extract="$EXTRACT_DIR" --xattrs --preserve "$SYSTEM_IMAGE_ABS" 2>&1 | tee dist/metadata/erofs-extract.log; then
            echo "::error::fsck.erofs extraction command failed"
            exit 1
          fi
          # A successful integrity scan is not sufficient: require real files.
          EXTRACTED_COUNT="$(sudo find "$EXTRACT_DIR" -mindepth 1 -maxdepth 3 -print -quit | wc -l)"
          if [[ "$EXTRACTED_COUNT" -eq 0 ]]; then
            echo "::error::fsck.erofs returned success but extracted zero entries"
            ls -ld "$EXTRACT_DIR"
            ls -lh "$SYSTEM_IMAGE_ABS"
            cat dist/metadata/erofs-extract.log
            exit 1
          fi
          if [[ -d work/system-root/app ]]; then
            SYSTEM_ROOT=work/system-root
            EROFS_MOUNT_POINT=/system
          elif [[ -d work/system-root/system/app ]]; then
            SYSTEM_ROOT=work/system-root/system
            EROFS_MOUNT_POINT=/
          else
            echo "::error::Could not locate the Android system app directory after EROFS extraction"
            find work/system-root -maxdepth 3 -type d | head -100
            exit 1
          fi
          echo "SYSTEM_ROOT=$SYSTEM_ROOT" >> "$GITHUB_ENV"
          echo "EROFS_MOUNT_POINT=$EROFS_MOUNT_POINT" >> "$GITHUB_ENV"
          sudo mkdir -p "$SYSTEM_ROOT/app" "$SYSTEM_ROOT/media" "$SYSTEM_ROOT/etc/experience-ui"
          declare -A appdirs=(
            [launcher]=ExperienceLauncher
            [settings]=ExperienceSettings
            [setupwizard]=ExperienceSetupWizard
            [notes]=ExperienceNotes
            [clock]=ExperienceClock
            [calendar]=ExperienceCalendar
            [calculator]=ExperienceCalculator
            [files]=ExperienceFiles
            [gallery]=ExperienceGallery
            [converter]=ExperienceConverter
            [ota-updater]=ExperienceUpdater
          )
          for apk in dist/apks/Experience-*.apk; do
            module="$(basename "$apk" .apk | sed 's/^Experience-//')"
            appdir="${appdirs[$module]:-}"
            [[ -n "$appdir" ]] || { echo "::error::Unexpected TV APK module: $module"; exit 1; }
            sudo mkdir -p "$SYSTEM_ROOT/app/$appdir"
            sudo install -o 0 -g 0 -m 0644 "$apk" "$SYSTEM_ROOT/app/$appdir/$appdir.apk"
          done
          sudo install -o 0 -g 0 -m 0644 bootanimation/bootanimation.zip "$SYSTEM_ROOT/media/bootanimation.zip"
          cat > dist/metadata/BUILD_INFO.txt <<'INFO'
          Experience UI TV — experimental x86_64 ISO repack
          Base: LineageOS 21.0 TV x86_64 unofficial ISO (2026-03-31)
          Android base: Android 14 / API 34 (upstream build configuration; verify on device)
          Included Experience UI apps: launcher, settings, setup wizard, notes, clock, calendar, calculator, files, gallery, converter, OTA updater
          Excluded from this TV build: Experience dialer, contacts, messages and camera modules
          Architecture: x86_64
          This is an experimental repack, not an official LineageOS build. Upstream system apps are not blindly removed.
          OTA installation is not enabled; no signed OTA package is published.
          Hardware boot, graphics, audio, Wi-Fi, Bluetooth, remote control, SELinux labels and app runtime behavior require testing on target hardware.
          INFO
          sudo install -o 0 -g 0 -m 0644 dist/metadata/BUILD_INFO.txt "$SYSTEM_ROOT/etc/experience-ui/BUILD_INFO.txt"
          # Use upstream Android file contexts if present so newly added system APKs receive the normal system_file label.
          CONTEXTS="$(find "$SYSTEM_ROOT/etc/selinux" -type f \( -name 'plat_file_contexts' -o -name 'file_contexts' \) -print -quit 2>/dev/null || true)"
          if [[ -n "$CONTEXTS" ]]; then
            echo "FILE_CONTEXTS=$CONTEXTS" >> "$GITHUB_ENV"
          else
            echo "::warning::No Android file_contexts file found in extracted system. SELinux labels must be verified before release."
          fi
          sudo find "$SYSTEM_ROOT/app" -maxdepth 2 -type f -name '*.apk' | sort > dist/metadata/integrated-apk-files.txt
          grep -q 'ExperienceLauncher/ExperienceLauncher.apk' dist/metadata/integrated-apk-files.txt
          grep -q 'ExperienceSettings/ExperienceSettings.apk' dist/metadata/integrated-apk-files.txt
          grep -q 'ExperienceUpdater/ExperienceUpdater.apk' dist/metadata/integrated-apk-files.txt

      - name: Rebuild EROFS system image
        shell: bash
        run: |
          set -Eeuo pipefail
          NEW_IMAGE="$PWD/work/system-experience-ui.efs"
          # Build a fresh EROFS image; never run ext4 debugfs/e2fsck tools on EROFS.
          if [[ -n "${FILE_CONTEXTS:-}" && -f "$FILE_CONTEXTS" ]]; then
            sudo mkfs.erofs -zlz4hc,9 -T 0 --mount-point="$EROFS_MOUNT_POINT" --file-contexts="$FILE_CONTEXTS" "$NEW_IMAGE" work/system-root
          else
            sudo mkfs.erofs -zlz4hc,9 -T 0 --mount-point="$EROFS_MOUNT_POINT" "$NEW_IMAGE" work/system-root
          fi
          test -s "$NEW_IMAGE"
          file "$NEW_IMAGE" | tee dist/metadata/rebuilt-system-image-file.txt
          grep -qi 'EROFS' dist/metadata/rebuilt-system-image-file.txt
          sha256sum "$NEW_IMAGE" | tee dist/metadata/rebuilt-system-image.sha256
          # Validate the rebuilt filesystem by listing/extracting it before replacing the ISO payload.
          sudo fsck.erofs --extract=work/verify-system "$NEW_IMAGE"
          test -s work/verify-system/app/ExperienceLauncher/ExperienceLauncher.apk -o -s work/verify-system/system/app/ExperienceLauncher/ExperienceLauncher.apk
          test -s work/verify-system/app/ExperienceSettings/ExperienceSettings.apk -o -s work/verify-system/system/app/ExperienceSettings/ExperienceSettings.apk

      - name: Rebuild ISO while preserving upstream boot records
        shell: bash
        run: |
          set -Eeuo pipefail
          ISO_PATH="${SYSTEM_IMAGE#work/iso-root}"
          [[ "$ISO_PATH" == /* ]] || { echo "::error::Unexpected ISO-relative system image path: $SYSTEM_IMAGE"; exit 1; }
          xorriso -indev base.iso -outdev dist/image/ExperienceUI-TV-x86_64-experimental.iso \
            -boot_image any replay -map "$PWD/work/system-experience-ui.efs" "$ISO_PATH" -commit
          test -s dist/image/ExperienceUI-TV-x86_64-experimental.iso
          file dist/image/ExperienceUI-TV-x86_64-experimental.iso | tee dist/metadata/output-iso-file.txt
          sha256sum dist/image/ExperienceUI-TV-x86_64-experimental.iso | tee dist/metadata/output-iso.sha256
          xorriso -indev dist/image/ExperienceUI-TV-x86_64-experimental.iso -report_el_torito plain > dist/metadata/output-boot-records.txt 2>&1
          grep -qi 'El Torito' dist/metadata/output-boot-records.txt || { echo "::error::Output ISO has no reported El Torito boot entry"; cat dist/metadata/output-boot-records.txt; exit 1; }
          xorriso -indev dist/image/ExperienceUI-TV-x86_64-experimental.iso -ls / > dist/metadata/output-iso-root.txt 2>&1
          grep -q "$(basename "$ISO_PATH")" dist/metadata/output-iso-root.txt

      - name: Upload TV ISO and build evidence
        uses: actions/upload-artifact@v4
        with:
          name: ExperienceUI-TV-x86_64-experimental
          path: |
            dist/image/ExperienceUI-TV-x86_64-experimental.iso
            dist/metadata/**
            dist/metadata-tv-app-modules.txt
            dist/apks/**
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
