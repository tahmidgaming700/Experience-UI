name: Experience UI GSI Repack
on:
  workflow_dispatch:
    inputs:
      variant:
        description: "Andy Yan base GSI variant"
        required: true
        type: choice
        options: [vanilla, gapps]
        default: vanilla
  push:
    paths:
      - ".github/workflows/experience-gsi-repack.yml"
permissions:
  contents: read
jobs:
  repack:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout Experience UI
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Configure preinstalled Android SDK
        run: |
          set -euxo pipefail
          SDK="$ANDROID_HOME"
          test -d "$SDK"
          if [ -x "$SDK/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          elif [ -x "$SDK/cmdline-tools/16.0/bin/sdkmanager" ]; then
            SDKMANAGER="$SDK/cmdline-tools/16.0/bin/sdkmanager"
          else
            echo "No usable sdkmanager found under $SDK" >&2
            exit 1
          fi
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Build Experience UI app suite
        run: |
          set -euxo pipefail
          gradle --no-daemon assembleDebug
          mkdir -p out/apks
          for module in launcher settings setupwizard dialer messages contacts notes clock calendar calculator files gallery camera converter app; do
            apk="$module/build/outputs/apk/debug/$module-debug.apk"
            test -s "$apk"
            cp "$apk" "out/apks/Experience-$module.apk"
          done
          cp out/apks/Experience-launcher.apk out/ExperienceLauncher.apk
      - name: Generate Experience UI boot animation
        run: |
          set -euxo pipefail
          python3 -m venv .venv
          .venv/bin/pip install pillow
          .venv/bin/python bootanimation/generate_bootanimation.py
          test -s bootanimation/bootanimation.zip
          cp bootanimation/bootanimation.zip out/bootanimation.zip
      - name: Install image tools
        run: |
          sudo apt-get update
          sudo apt-get install -y android-sdk-libsparse-utils e2fsprogs gzip wget file qemu-utils
      - name: Download Andy Yan base GSI
        env:
          VARIANT: \${{ github.event.inputs.variant || 'vanilla' }}
        run: |
          set -euxo pipefail
          DIR="lineage-21-pre-qpr2-td"
          if [ "$VARIANT" = "gapps" ]; then
            FILE="lineage-21.0-20260614-UNOFFICIAL-arm64_bgN-signed.img.gz"
          else
            FILE="lineage-21.0-20260614-UNOFFICIAL-arm64_bvN.img.gz"
          fi
          URL="https://sourceforge.net/projects/andyyan-gsi/files/$DIR/$FILE/download"
          wget --https-only --max-redirect=20 --tries=3 --timeout=60 -O base.img.gz "$URL"
          gzip -t base.img.gz
          gzip -dc base.img.gz > base.img
          file base.img
          sha256sum base.img | tee out/base-image.sha256
      - name: Expand and validate filesystem
        run: |
          set -euxo pipefail
          test -s base.img
          if file base.img | grep -qi 'Android sparse'; then
            simg2img base.img system.raw.img
          else
            cp --reflink=auto base.img system.raw.img
          fi
          file system.raw.img
          e2fsck -fn system.raw.img
          mkdir -p mountpoint
          sudo mount -o loop,rw system.raw.img mountpoint
      - name: Integrate current Experience UI components
        env:
          VARIANT: \${{ github.event.inputs.variant || 'vanilla' }}
        run: |
          set -euxo pipefail
          for apk in out/apks/Experience-*.apk; do
            module="$(basename "$apk" .apk | sed 's/^Experience-//')"
            case "$module" in
              launcher) appdir="ExperienceLauncher" ;;
              settings) appdir="ExperienceSettings" ;;
              setupwizard) appdir="ExperienceSetupWizard" ;;
              dialer) appdir="ExperienceDialer" ;;
              messages) appdir="ExperienceMessages" ;;
              contacts) appdir="ExperienceContacts" ;;
              notes) appdir="ExperienceNotes" ;;
              clock) appdir="ExperienceClock" ;;
              calendar) appdir="ExperienceCalendar" ;;
              calculator) appdir="ExperienceCalculator" ;;
              files) appdir="ExperienceFiles" ;;
              gallery) appdir="ExperienceGallery" ;;
              camera) appdir="ExperienceCamera" ;;
              converter) appdir="ExperienceConverter" ;;
              app) appdir="ExperienceOSConverter" ;;
              *) echo "Unexpected APK module: $module" >&2; exit 1 ;;
            esac
            sudo mkdir -p "mountpoint/system/app/$appdir"
            sudo install -m 0644 "$apk" "mountpoint/system/app/$appdir/$appdir.apk"
          done
          sudo mkdir -p mountpoint/system/media
          sudo install -m 0644 out/bootanimation.zip mountpoint/system/media/bootanimation.zip
          sudo mkdir -p mountpoint/etc/experience-ui
          sudo tee mountpoint/etc/experience-ui/BUILD_INFO.txt >/dev/null <<EOF
          Experience UI experimental GSI repack
          Base: Andy Yan LineageOS GSI lineage-21.0-20260614
          Variant: $VARIANT
          Architecture: arm64
          Partition family: b (A/B / system-as-root GSI convention)
          Integrated components: Experience UI launcher and companion app suite plus boot animation
          This is an application integration image, not a complete replacement SystemUI/framework ROM.
          Not QEMU-boot-tested and not device-tested. Do not flash until compatibility is verified.
          EOF
          sudo sync
          sudo umount mountpoint
          e2fsck -fy system.raw.img
          resize2fs -M system.raw.img
          mv system.raw.img out/ExperienceUI-arm64-experimental.img
          file out/ExperienceUI-arm64-experimental.img
          qemu-img info out/ExperienceUI-arm64-experimental.img
          e2fsck -fn out/ExperienceUI-arm64-experimental.img
          sha256sum out/ExperienceUI-arm64-experimental.img | tee out/ExperienceUI.sha256
      - name: Publish experimental image artifact
        uses: actions/upload-artifact@v4
        with:
          name: experience-ui-gsi-experimental
          path: |
            out/ExperienceUI-arm64-experimental.img
            out/ExperienceUI.sha256
            out/base-image.sha256
            out/ExperienceLauncher.apk
            out/apks/*.apk
            out/bootanimation.zip
          if-no-files-found: error
          retention-days: 7
