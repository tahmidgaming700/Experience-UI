name: Experience UI — Repack Andy Yan Android 12 GSI

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/experience-gsi-repack.yml"
      - "launcher/**"
      - "core-ui/**"
      - "settings/**"
      - "setupwizard/**"
      - "dialer/**"
      - "messages/**"
      - "contacts/**"
      - "notes/**"
      - "clock/**"
      - "calendar/**"
      - "calculator/**"
      - "files/**"
      - "gallery/**"
      - "camera/**"
      - "converter/**"
      - "bootanimation/**"
      - "rom-integration/**"

permissions:
  contents: read

jobs:
  repack:
    # A hosted Linux runner is intentional: the image needs a privileged loop mount.
    # An unrooted Android/Termux self-hosted runner cannot safely do that.
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      BASE_FILE: lineage-19.1-20250606-UNOFFICIAL-arm64_bgN-signed.img.gz
      BASE_URL: https://sourceforge.net/projects/andyyan-gsi/files/lineage-19.x/lineage-19.1-20250606-UNOFFICIAL-arm64_bgN-signed.img.gz/download
    steps:
      - name: Checkout Experience UI
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Configure Android SDK
        shell: bash
        run: |
          set -Eeuo pipefail
          SDKMANAGER="$(find /usr/local/lib/android /opt -type f -path '*/cmdline-tools/*/bin/sdkmanager' -print -quit 2>/dev/null || true)"
          if [[ -z "$SDKMANAGER" ]]; then
            echo "::error::Android SDK command-line tools were not found on the runner."
            exit 1
          fi
          SDK_BIN="$(dirname "$SDKMANAGER")"
          SDK_ROOT="${SDK_BIN%%/cmdline-tools/*}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_BIN" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Build Experience UI APK suite
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon assembleDebug
          mkdir -p dist/apks
          for module in launcher settings setupwizard dialer messages contacts notes clock calendar calculator files gallery camera converter; do
            apk="$module/build/outputs/apk/debug/$module-debug.apk"
            if [ ! -s "$apk" ]; then
              echo "::error::Expected APK not found: $apk"
              find "$module/build/outputs" -type f -name '*.apk' 2>/dev/null || true
              exit 1
            fi
            cp "$apk" "dist/apks/Experience-$module.apk"
          done
          ls -lh dist/apks

      - name: Generate Experience UI boot animation
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv .venv
          .venv/bin/pip install --disable-pip-version-check Pillow
          .venv/bin/python bootanimation/generate_bootanimation.py
          test -s bootanimation/bootanimation.zip
          mkdir -p dist/bootanimation
          cp bootanimation/bootanimation.zip dist/bootanimation/
          if [ -s bootanimation/experience-boot-preview.gif ]; then
            cp bootanimation/experience-boot-preview.gif dist/bootanimation/
          fi

      - name: Install image tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y android-sdk-libsparse-utils e2fsprogs gzip wget file qemu-utils

      - name: Download the supplied Andy Yan Android 12 GApps GSI
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/metadata
          wget --https-only --max-redirect=20 --tries=3 --timeout=60 \
            -O base.img.gz "$BASE_URL"
          gzip -t base.img.gz
          gzip -dc base.img.gz > base.img
          test -s base.img
          file base.img
          sha256sum base.img | tee dist/metadata/base-image.sha256
          printf '%s\n' "$BASE_URL" > dist/metadata/base-image-url.txt
          printf '%s\n' "$BASE_FILE" > dist/metadata/base-image-filename.txt

      - name: Expand and validate image before editing
        shell: bash
        run: |
          set -euo pipefail
          if file base.img | grep -qi 'Android sparse'; then
            simg2img base.img system.raw.img
          else
            cp --reflink=auto base.img system.raw.img
          fi
          file system.raw.img
          e2fsck -fn system.raw.img

          # The supplied image is nearly full. Expand the copy by 384 MiB
          # so app integration has room; this is experimental and not a
          # claim that the target device's system partition can hold it.
          truncate -s +384M system.raw.img
          e2fsck -f -y system.raw.img
          resize2fs system.raw.img
          e2fsck -fn system.raw.img

      - name: Integrate Experience UI APKs and boot animation (offline filesystem editing)
        shell: bash
        run: |
          set -euo pipefail

          # Do not use a kernel loop mount here. The previous run repeatedly
          # failed at mount -o loop,rw with exit 32 despite e2fsck succeeding.
          # debugfs edits the ext filesystem offline, avoiding that mount path.
          df() {
            local output
            output="$(debugfs "$@" system.raw.img 2>&1)" || {
              printf '%s\\n' "$output"
              return 1
            }
            printf '%s\\n' "$output"
            if grep -Eqi 'File not found|Couldn.t|Invalid|Usage:|Command not found|Filesystem not open' <<<"$output"; then
              echo "::error::debugfs command failed: $*"
              return 1
            fi
          }

          df -R 'stats' > dist/metadata/filesystem-before.txt
          df -R 'ls -l /system/app'

          ensure_dir() {
            local path="$1"
            local stat_output
            stat_output="$(df -R "stat $path" system.raw.img 2>&1 || true)"
            if ! grep -q 'Inode:' <<<"$stat_output"; then
              df -w -R "mkdir $path"
            fi
            df -w -R "set_inode_field $path mode 040755"
            df -w -R "set_inode_field $path uid 0"
            df -w -R "set_inode_field $path gid 0"
            df -w -R "ea_set $path security.selinux u:object_r:system_file:s0"
          }

          ensure_dir /system/app
          ensure_dir /system/media
          ensure_dir /system/etc
          ensure_dir /system/etc/experience-ui

          for apk in dist/apks/Experience-*.apk; do
            module="$(basename "$apk" .apk | sed 's/^Experience-//')"
            case "$module" in
              launcher) appdir="ExperienceLauncher" ;;
              settings) appdir="ExperienceSettings" ;;
              setupwizard) appdir="ExperienceSetupWizard" ;;
              dialer) appdir="ExperienceDialer" ;;
              messages) appdir="ExperienceMessages" ;;
              contacts) appdir="ExperienceContacts" ;;
              notes) appdir="ExperienceNotes" ;;
              clock) appdir="ExperienceClock" ;;
              calendar) appdir="ExperienceCalendar" ;;
              calculator) appdir="ExperienceCalculator" ;;
              files) appdir="ExperienceFiles" ;;
              gallery) appdir="ExperienceGallery" ;;
              camera) appdir="ExperienceCamera" ;;
              converter) appdir="ExperienceConverter" ;;
              *) echo "::error::Unexpected APK module: $module"; exit 1 ;;
            esac

            target="/system/app/$appdir"
            ensure_dir "$target"
            df -w -R "write $apk $target/$appdir.apk" system.raw.img
            df -w -R "set_inode_field $target/$appdir.apk mode 0100644" system.raw.img
            df -w -R "set_inode_field $target/$appdir.apk uid 0" system.raw.img
            df -w -R "set_inode_field $target/$appdir.apk gid 0" system.raw.img
            df -w -R "ea_set $target/$appdir.apk security.selinux u:object_r:system_file:s0" system.raw.img
            df -R "stat $target/$appdir.apk" system.raw.img
          done

          df -w -R 'write dist/bootanimation/bootanimation.zip /system/media/bootanimation.zip' system.raw.img
          df -w -R 'set_inode_field /system/media/bootanimation.zip mode 0100644' system.raw.img
          df -w -R 'set_inode_field /system/media/bootanimation.zip uid 0' system.raw.img
          df -w -R 'set_inode_field /system/media/bootanimation.zip gid 0' system.raw.img
          df -w -R 'ea_set /system/media/bootanimation.zip security.selinux u:object_r:system_file:s0' system.raw.img

          cat > dist/metadata/BUILD-INFO.txt <<EOF
          Experience UI experimental GSI repack
          Base: Andy Yan LineageOS 19.1 Android 12 GApps GSI
          Base file: $BASE_FILE
          Architecture: ARM64
          Included: Experience UI APK suite and boot animation
          Status: Experimental; not boot-tested or device-tested
          Target: Huawei Y9 2019 JKM-LX2 compatibility is unconfirmed
          This is not a complete device-specific ROM. Do not flash without independent compatibility verification.
          EOF
          df -w -R 'write dist/metadata/BUILD-INFO.txt /system/etc/experience-ui/BUILD_INFO.txt' system.raw.img
          df -w -R 'set_inode_field /system/etc/experience-ui/BUILD_INFO.txt mode 0100644' system.raw.img
          df -w -R 'set_inode_field /system/etc/experience-ui/BUILD_INFO.txt uid 0' system.raw.img
          df -w -R 'set_inode_field /system/etc/experience-ui/BUILD_INFO.txt gid 0' system.raw.img
          df -w -R 'ea_set /system/etc/experience-ui/BUILD_INFO.txt security.selinux u:object_r:system_file:s0' system.raw.img

          df -R 'ls -l /system/media' system.raw.img
          df -R 'ls -l /system/etc/experience-ui' system.raw.img

      - name: Validate and package experimental image
        shell: bash
        run: |
          set -euo pipefail
          e2fsck -fn system.raw.img
          mkdir -p dist/image
          cp system.raw.img dist/image/ExperienceUI-Android12-arm64-experimental.img
          file dist/image/ExperienceUI-Android12-arm64-experimental.img
          qemu-img info dist/image/ExperienceUI-Android12-arm64-experimental.img
          sha256sum dist/image/ExperienceUI-Android12-arm64-experimental.img | tee dist/metadata/ExperienceUI-image.sha256
          {
            echo "Experience UI experimental GSI repack"
            echo "Base: Andy Yan LineageOS 19.1 Android 12 GApps GSI"
            echo "Source URL: $BASE_URL"
            echo "Architecture: ARM64"
            echo "Added: Experience UI APK suite and boot animation"
            echo "Validation: ext filesystem checked; Android boot not tested"
            echo "Device compatibility: unconfirmed for Huawei Y9 2019 JKM-LX2"
            echo "Do not flash unless compatibility, partition size, bootloader access and recovery route are verified."
          } > dist/metadata/BUILD-STATUS.txt

      - name: Upload experimental artifacts
        uses: actions/upload-artifact@v4
        with:
          name: experience-ui-android12-gsi-experimental
          path: |
            dist/image/ExperienceUI-Android12-arm64-experimental.img
            dist/apks/*.apk
            dist/bootanimation/*
            dist/metadata/*
          if-no-files-found: error
          retention-days: 14
