# Re-run the GSI packaging pipeline so the virtual-boot workflow can test the exact newly-built artifact.
name: Build Experience UI GSI (GitHub Ubuntu)

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-gsi.yml"
      - ".github/workflows/experience-gsi-repack.yml"
      - "gsi/**"
      - "rom-integration/**"
      - "launcher/**"
      - "core-ui/**"
      - "settings/**"
      - "setupwizard/**"
      - "dialer/**"
      - "messages/**"
      - "contacts/**"
      - "notes/**"
      - "clock/**"
      - "calendar/**"
      - "calculator/**"
      - "files/**"
      - "gallery/**"
      - "camera/**"
      - "converter/**"
      - "bootanimation/**"

permissions:
  contents: read

jobs:
  build-gsi:
    # Hosted Ubuntu is used for prebuilt-GSI repacking and APK compilation.
    # This is NOT a full LineageOS source build.
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      BASE_URL: https://sourceforge.net/projects/andyyan-gsi/files/lineage-19.x/lineage-19.1-20250606-UNOFFICIAL-arm64_bgN-signed.img.gz/download
      BASE_FILE: lineage-19.1-20250606-UNOFFICIAL-arm64_bgN-signed.img.gz

    steps:
      - name: Checkout Experience UI
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Configure Android SDK on hosted Ubuntu
        shell: bash
        run: |
          set -euo pipefail
          # Locate the actual sdkmanager executable instead of assuming the
          # runner's SDK layout or relying on ANDROID_HOME being pre-exported.
          SDKMANAGER="$(find /usr/local/lib/android /opt -type f -path '*/cmdline-tools/*/bin/sdkmanager' -print -quit 2>/dev/null || true)"
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::sdkmanager was not found on this GitHub-hosted runner."
            find /usr/local/lib/android /opt -maxdepth 5 -type f -name sdkmanager -print 2>/dev/null || true
            exit 1
          fi
          SDK_BIN="$(dirname "$SDKMANAGER")"
          SDK_ROOT="${SDK_BIN%%/cmdline-tools/*}"
          if [ "$SDK_ROOT" = "$SDK_BIN" ] || [ ! -d "$SDK_ROOT" ]; then
            echo "::error::Could not determine Android SDK root from $SDKMANAGER"
            exit 1
          fi
          echo "Using sdkmanager: $SDKMANAGER"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_BIN" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          "$SDKMANAGER" --version
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Build Experience UI APKs
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon assembleDebug
          mkdir -p dist/apks
          for module in launcher settings setupwizard dialer messages contacts notes clock calendar calculator files gallery camera converter; do
            apk="$module/build/outputs/apk/debug/$module-debug.apk"
            if [ ! -s "$apk" ]; then
              echo "::error::Expected APK missing: $apk"
              find "$module/build/outputs" -type f -name '*.apk' 2>/dev/null || true
              exit 1
            fi
            cp "$apk" "dist/apks/Experience-$module.apk"
          done

      - name: Generate boot animation
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv .venv
          .venv/bin/pip install --disable-pip-version-check Pillow
          .venv/bin/python bootanimation/generate_bootanimation.py
          test -s bootanimation/bootanimation.zip
          mkdir -p dist/bootanimation
          cp bootanimation/bootanimation.zip dist/bootanimation/
          if [ -s bootanimation/experience-boot-preview.gif ]; then
            cp bootanimation/experience-boot-preview.gif dist/bootanimation/
          fi

      - name: Install image utilities
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y e2fsprogs gzip wget file qemu-utils

      - name: Download supplied Andy Yan Android 12 GApps GSI
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/metadata
          wget --https-only --max-redirect=20 --tries=3 --timeout=60 -O base.img.gz "$BASE_URL"
          gzip -t base.img.gz
          gzip -dc base.img.gz > base.img
          test -s base.img
          file base.img
          sha256sum base.img | tee dist/metadata/base-image.sha256
          printf '%s\n' "$BASE_URL" > dist/metadata/base-image-url.txt
          printf '%s\n' "$BASE_FILE" > dist/metadata/base-image-filename.txt

      - name: Validate and prepare working filesystem image
        shell: bash
        run: |
          set -euo pipefail
          if file base.img | grep -qi 'Android sparse'; then
            simg2img base.img system.raw.img
          else
            cp --reflink=auto base.img system.raw.img
          fi
          file system.raw.img
          e2fsck -fn system.raw.img
          # Create a separate expanded working image; target partition capacity
          # is unknown, so this output is experimental and must not be flashed yet.
          truncate -s +384M system.raw.img
          e2fsck -f -y system.raw.img
          resize2fs system.raw.img
          e2fsck -fn system.raw.img

      - name: Integrate APKs and boot animation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p mountpoint
          sudo mount -o loop,rw system.raw.img mountpoint
          cleanup() { sudo umount mountpoint 2>/dev/null || true; }
          trap cleanup EXIT

          for apk in dist/apks/Experience-*.apk; do
            module="$(basename "$apk" .apk | sed 's/^Experience-//')"
            case "$module" in
              launcher) appdir="ExperienceLauncher" ;;
              settings) appdir="ExperienceSettings" ;;
              setupwizard) appdir="ExperienceSetupWizard" ;;
              dialer) appdir="ExperienceDialer" ;;
              messages) appdir="ExperienceMessages" ;;
              contacts) appdir="ExperienceContacts" ;;
              notes) appdir="ExperienceNotes" ;;
              clock) appdir="ExperienceClock" ;;
              calendar) appdir="ExperienceCalendar" ;;
              calculator) appdir="ExperienceCalculator" ;;
              files) appdir="ExperienceFiles" ;;
              gallery) appdir="ExperienceGallery" ;;
              camera) appdir="ExperienceCamera" ;;
              converter) appdir="ExperienceConverter" ;;
              *) echo "::error::Unexpected APK module: $module"; exit 1 ;;
            esac
            sudo install -d -m 0755 "mountpoint/system/app/$appdir"
            sudo install -m 0644 "$apk" "mountpoint/system/app/$appdir/$appdir.apk"
          done

          sudo install -d -m 0755 mountpoint/system/media
          sudo install -m 0644 dist/bootanimation/bootanimation.zip mountpoint/system/media/bootanimation.zip
          sudo install -d -m 0755 mountpoint/etc/experience-ui
          sudo tee mountpoint/etc/experience-ui/BUILD_INFO.txt >/dev/null <<'INFO'
          Experience UI experimental Android 12 GSI repack
          Base: Andy Yan LineageOS 19.1 GApps ARM64
          Included: Experience UI APKs and boot animation
          Status: Experimental; Android boot not tested
          Huawei Y9 2019 JKM-LX2 compatibility is unconfirmed
          This is not a device-specific ROM. Do not flash until partition size,
          bootloader/recovery access, and device compatibility are independently verified.
          INFO
          sudo sync
          sudo umount mountpoint
          trap - EXIT

      - name: Validate and package experimental artifacts
        shell: bash
        run: |
          set -euo pipefail
          e2fsck -fn system.raw.img
          mkdir -p dist/image
          cp system.raw.img dist/image/ExperienceUI-Android12-arm64-experimental.img
          file dist/image/ExperienceUI-Android12-arm64-experimental.img
          qemu-img info dist/image/ExperienceUI-Android12-arm64-experimental.img
          sha256sum dist/image/ExperienceUI-Android12-arm64-experimental.img | tee dist/metadata/ExperienceUI-image.sha256
          {
            echo "Build: experimental GSI repack"
            echo "Base: Andy Yan LineageOS 19.1 Android 12 GApps ARM64"
            echo "Validation: filesystem check passed if workflow reached this step"
            echo "Android boot: not tested"
            echo "Huawei Y9 2019 JKM-LX2 compatibility: unconfirmed"
            echo "Do not flash without independent compatibility and partition-size verification."
          } > dist/metadata/BUILD-STATUS.txt

      - name: Upload experimental GSI and APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: experience-ui-gsi-ubuntu-experimental
          path: dist/
          if-no-files-found: error
          retention-days: 14
