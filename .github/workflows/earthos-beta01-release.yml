name: EarthOS Beta 01 — build and release

on:
  push:
    branches:
      - earthos/beta-01-release
    paths:
      - "earthos/**"
      - ".github/workflows/earthos-beta01-release.yml"
      - "settings.gradle.kts"
      - "**/build.gradle.kts"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: earthos-beta01-release
  cancel-in-progress: false

jobs:
  build:
    name: Build stock-based EarthOS ISO on macOS 26 Intel
    runs-on: macos-26-intel
    timeout-minutes: 180
    env:
      ISO_URL: https://sourceforge.net/projects/android-x86/files/Release%209.0/android-x86_64-9.0-r2.iso/download
      ISO_NAME: android-x86_64-9.0-r2.iso
      RELEASE_TAG: earthos-beta-01
      RELEASE_VERSION: 1.0.0-beta.1

    steps:
      - name: Check out EarthOS source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Configure Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-$HOME/Library/Android/sdk}"
          if [[ ! -x "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]]; then
            echo "::error::Android SDK command-line tools not found at $SDK_ROOT."
            exit 1
          fi
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          set +o pipefail
          yes | "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          LICENSE_STATUS=${PIPESTATUS[1]}
          set -o pipefail
          if (( LICENSE_STATUS != 0 )); then
            echo "::error::Android SDK licence acceptance failed."
            exit "$LICENSE_STATUS"
          fi
          "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Verify Intel runner
        shell: bash
        run: |
          set -euo pipefail
          echo "macOS $(sw_vers -productVersion) / $(uname -m)"
          [[ "$(uname -m)" == "x86_64" ]] || { echo "::error::EarthOS Beta 01 requires the x86_64 macOS 26 Intel runner."; exit 1; }
          df -h "$RUNNER_TEMP"

      - name: Install ISO and SquashFS tools
        shell: bash
        run: |
          set -euo pipefail
          brew install xorriso squashfs imagemagick

      - name: Build application source modules from scratch
        shell: bash
        run: |
          set -euo pipefail
          gradle clean assembleDebug --no-daemon --stacktrace
          echo "All repository application modules compiled from source." >> "$GITHUB_STEP_SUMMARY"
          echo "These Experience UI APKs are deliberately not injected into Beta 01; this release keeps the stock Android 9 interface." >> "$GITHUB_STEP_SUMMARY"

      - name: Download Android-x86 9.0-r2 base ISO
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/earthos/base" dist
          curl --fail --location --retry 5 --retry-all-errors --connect-timeout 30 --max-time 1800 \
            --output "$RUNNER_TEMP/earthos/base/$ISO_NAME" "$ISO_URL"
          ISO="$RUNNER_TEMP/earthos/base/$ISO_NAME"
          test -s "$ISO"
          SIZE="$(stat -f%z "$ISO")"
          if (( SIZE < 300000000 )); then
            echo "::error::Base ISO download is unexpectedly small ($SIZE bytes)."
            file "$ISO" || true
            exit 1
          fi
          file "$ISO"
          shasum -a 256 "$ISO" | tee dist/base-iso.sha256
          echo "Base ISO size: $SIZE bytes" >> "$GITHUB_STEP_SUMMARY"

      - name: Extract, brand, and rebuild EarthOS ISO
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/earthos/work" dist
          bash earthos/scripts/repack-android-x86.sh \
            "$RUNNER_TEMP/earthos/base/$ISO_NAME" \
            "$RUNNER_TEMP/earthos/dist/earthos-beta-01-x86_64.iso" \
            "$RUNNER_TEMP/earthos/work"
          cp "$RUNNER_TEMP/earthos/dist/earthos-beta-01-x86_64.iso" dist/
          cp "$RUNNER_TEMP/earthos/dist/earthos-beta-01-x86_64.iso.sha256" dist/

      - name: Generate OTA manifest with verified ISO checksum
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$GITHUB_REPOSITORY" "$RELEASE_TAG" "$RELEASE_VERSION" "dist/earthos-beta-01-x86_64.iso" "dist/ota-manifest.json" <<'PY'
          import hashlib,json,os,sys
          repo,tag,version,package,out=sys.argv[1:]
          h=hashlib.sha256()
          size=0
          with open(package,"rb") as f:
              for block in iter(lambda:f.read(1024*1024),b""):
                  h.update(block); size+=len(block)
          manifest={
            "schema_version":1,
            "project":"EarthOS",
            "channel":"beta",
            "version":version,
            "build_id":"EarthOS-Beta-01",
            "android_base":"Android-x86 9.0-r2",
            "android_api":28,
            "architecture":"x86_64",
            "package":{
              "type":"full_iso",
              "filename":os.path.basename(package),
              "url":f"https://github.com/{repo}/releases/download/{tag}/{os.path.basename(package)}",
              "sha256":h.hexdigest(),
              "size_bytes":size
            },
            "source":{
              "repository":f"https://github.com/{repo}",
              "ref":tag,
              "archive_url":f"https://github.com/{repo}/archive/refs/tags/{tag}.zip"
            },
            "release_notes":[
              "Android-x86 9.0-r2 base, x86_64.",
              "Stock Android launcher, first-boot experience, and stock apps are retained.",
              "No Experience UI launcher, setup wizard, theme, or app suite is installed in Beta 01.",
              "EarthOS boot identity, boot animation, wallpaper asset, and system metadata are included.",
              "Experimental release; hardware boot testing is still required."
            ]
          }
          with open(out,"w",encoding="utf-8") as f: json.dump(manifest,f,indent=2); f.write("\n")
          with open("dist/earthos-beta-01-x86_64.iso.sha256","w") as f: f.write(h.hexdigest()+"  "+os.path.basename(package)+"\n")
          print(json.dumps(manifest,indent=2))
          PY
          cat dist/ota-manifest.json >> "$GITHUB_STEP_SUMMARY"

      - name: Upload EarthOS build artifacts
        uses: actions/upload-artifact@v5
        with:
          name: earthos-beta-01-x86_64-build
          path: |
            dist/earthos-beta-01-x86_64.iso
            dist/earthos-beta-01-x86_64.iso.sha256
            dist/ota-manifest.json
            dist/base-iso.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Publish EarthOS Beta 01 GitHub Release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: earthos-beta-01
          target_commitish: ${{ github.sha }}
          name: EarthOS Beta 01
          prerelease: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/earthos-beta-01-x86_64.iso
            dist/earthos-beta-01-x86_64.iso.sha256
            dist/ota-manifest.json
            dist/base-iso.sha256
