name: Build Experience UI GSI (GitHub Ubuntu)

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - ".github/workflows/build-gsi.yml"
      - "gsi/**"
      - "rom-integration/**"
      - "launcher/**"
      - "core-ui/**"
      - "settings/**"
      - "setupwizard/**"
      - "dialer/**"
      - "messages/**"
      - "contacts/**"
      - "notes/**"
      - "clock/**"
      - "calendar/**"
      - "calculator/**"
      - "files/**"
      - "gallery/**"
      - "camera/**"
      - "converter/**"
      - "ota-updater/**"
      - "ota/**"
      - "bootanimation/**"
      - "settings.gradle.kts"
      - "build.gradle.kts"

permissions:
  contents: read

concurrency:
  group: harmony-experience-ui-gsi-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-gsi:
    name: Build, repack, and validate ARM64 GSI
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      BASE_URL: https://sourceforge.net/projects/andyyan-gsi/files/lineage-19.x/lineage-19.1-20250606-UNOFFICIAL-arm64_bgN-signed.img.gz/download
      BASE_FILE: lineage-19.1-20250606-UNOFFICIAL-arm64_bgN-signed.img.gz
      BUILD_TOOLS_VERSION: "35.0.0"

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Configure Android SDK
        shell: bash
        run: |
          set -Eeuo pipefail
          SDKMANAGER="$(find /usr/local/lib/android /opt -type f -path '*/cmdline-tools/*/bin/sdkmanager' -print -quit 2>/dev/null || true)"
          if [[ -z "$SDKMANAGER" ]]; then
            echo "::error::sdkmanager not found on runner"
            exit 1
          fi
          SDK_BIN="$(dirname "$SDKMANAGER")"
          SDK_ROOT="${SDK_BIN%%/cmdline-tools/*}"
          [[ -d "$SDK_ROOT" ]] || { echo "::error::Cannot determine SDK root"; exit 1; }
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_BIN" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0" "emulator"

      - name: Build every app module
        shell: bash
        run: |
          set -Eeuo pipefail
          gradle --no-daemon --stacktrace clean assembleDebug
          mkdir -p dist/apks
          modules=(launcher settings setupwizard dialer messages contacts notes clock calendar calculator files gallery camera converter ota-updater)
          for module in "${modules[@]}"; do
            apk="$module/build/outputs/apk/debug/$module-debug.apk"
            if [[ ! -s "$apk" ]]; then
              echo "::error::APK missing or empty: $apk"
              find "$module/build/outputs" -type f -name '*.apk' -print 2>/dev/null || true
              exit 1
            fi
            cp "$apk" "dist/apks/Experience-$module.apk"
          done
          test "$(find dist/apks -maxdepth 1 -type f -name '*.apk' | wc -l)" -eq "${#modules[@]}"
          ls -lh dist/apks

      - name: Validate APKs
        shell: bash
        run: |
          set -Eeuo pipefail
          AAPT="$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION/aapt"
          APKSIGNER="$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION/apksigner"
          for apk in dist/apks/*.apk; do
            "$AAPT" dump badging "$apk" >/dev/null
            "$APKSIGNER" verify --verbose "$apk"
            unzip -t "$apk" >/dev/null
          done

      - name: Generate and validate boot animation
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m venv .venv
          .venv/bin/pip install --disable-pip-version-check Pillow
          .venv/bin/python bootanimation/generate_bootanimation.py
          test -s bootanimation/bootanimation.zip
          test -s bootanimation/experience-boot-preview.gif
          unzip -t bootanimation/bootanimation.zip
          python3 - <<'PY'
          import zipfile
          with zipfile.ZipFile("bootanimation/bootanimation.zip") as z:
              names = z.namelist()
              assert "desc.txt" in names
              assert any(n.startswith("part0/") and n.endswith(".png") for n in names)
              assert z.read("desc.txt").decode().splitlines()[0].split() == ["720", "1280", "30"]
          print("Boot animation archive validated")
          PY
          mkdir -p dist/bootanimation
          cp bootanimation/bootanimation.zip bootanimation/experience-boot-preview.gif dist/bootanimation/

      - name: Install image utilities
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y e2fsprogs gzip wget file qemu-utils android-sdk-libsparse-utils

      - name: Download and verify Android 12 ARM64 base GSI
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p dist/metadata
          wget --https-only --max-redirect=20 --tries=4 --retry-connrefused --timeout=90 -O base.img.gz "$BASE_URL"
          gzip -t base.img.gz
          gzip -dc base.img.gz > base.img
          test -s base.img
          file base.img | tee dist/metadata/base-image-file.txt
          sha256sum base.img | tee dist/metadata/base-image.sha256
          printf '%s\n' "$BASE_URL" > dist/metadata/base-image-url.txt
          printf '%s\n' "$BASE_FILE" > dist/metadata/base-image-filename.txt

      - name: Detect and prepare ext4 filesystem
        shell: bash
        run: |
          set -Eeuo pipefail
          IMAGE_TYPE="$(file -b base.img)"
          echo "Detected: $IMAGE_TYPE"
          if grep -qi 'Android sparse' <<<"$IMAGE_TYPE"; then
            simg2img base.img system.raw.img
          else
            cp --reflink=auto base.img system.raw.img
          fi
          file system.raw.img | tee dist/metadata/working-image-file.txt
          if ! dumpe2fs -h system.raw.img > dist/metadata/ext4-header.txt 2>dist/metadata/ext4-header-error.txt; then
            echo "::error::Base image is not a directly writable ext4 filesystem; refusing unsafe conversion."
            cat dist/metadata/ext4-header-error.txt
            exit 1
          fi
          e2fsck -fn system.raw.img
          truncate -s +512M system.raw.img
          e2fsck -f -y system.raw.img
          resize2fs system.raw.img
          e2fsck -fn system.raw.img

      - name: Integrate apps, updater, metadata, and boot animation
        shell: bash
        run: |
          set -Eeuo pipefail
          # debugfs often exits 0 even when a requested path is missing, so
          # test its output rather than relying on the process exit code.
          path_type() {
            debugfs -R "stat $1" system.raw.img 2>&1 | sed -n 's/^[[:space:]]*Type: \([^ ]*\).*/\1/p' | head -n 1
          }
          require_dir() {
            local path="$1"
            local type
            type="$(path_type "$path" || true)"
            if [[ "$type" != "directory" ]]; then
              echo "::error::Required directory missing from base system image: $path (type='$type')"
              debugfs -R 'ls -l /' system.raw.img || true
              exit 1
            fi
          }
          write_image() {
            debugfs -w -R "$1" system.raw.img
          }
          ensure_dir() {
            local path="$1"
            local type
            type="$(path_type "$path" || true)"
            if [[ "$type" != "directory" ]]; then
              write_image "mkdir $path"
            fi
            type="$(path_type "$path" || true)"
            if [[ "$type" != "directory" ]]; then
              echo "::error::Could not create directory in image: $path (type='$type')"
              exit 1
            fi
          }

          # A system.img filesystem normally exposes app/media/etc at its root.
          # Fail explicitly if the downloaded base uses a different layout.
          require_dir /app
          require_dir /media
          require_dir /etc

          for apk in dist/apks/Experience-*.apk; do
            module="$(basename "$apk" .apk | sed 's/^Experience-//')"
            case "$module" in
              launcher) appdir=ExperienceLauncher ;;
              settings) appdir=ExperienceSettings ;;
              setupwizard) appdir=ExperienceSetupWizard ;;
              dialer) appdir=ExperienceDialer ;;
              messages) appdir=ExperienceMessages ;;
              contacts) appdir=ExperienceContacts ;;
              notes) appdir=ExperienceNotes ;;
              clock) appdir=ExperienceClock ;;
              calendar) appdir=ExperienceCalendar ;;
              calculator) appdir=ExperienceCalculator ;;
              files) appdir=ExperienceFiles ;;
              gallery) appdir=ExperienceGallery ;;
              camera) appdir=ExperienceCamera ;;
              converter) appdir=ExperienceConverter ;;
              ota-updater) appdir=ExperienceUpdater ;;
              *) echo "::error::Unexpected APK module: $module"; exit 1 ;;
            esac
            ensure_dir "/app/$appdir"
            write_image "write $apk /app/$appdir/$appdir.apk"
            write_image "set_inode_field /app/$appdir/$appdir.apk mode 0100644"
            if ! debugfs -R "stat /app/$appdir/$appdir.apk" system.raw.img 2>&1 | grep -q 'Type: regular'; then
              echo "::error::APK was not written into image: $appdir"
              exit 1
            fi
          done

          write_image "write dist/bootanimation/bootanimation.zip /media/bootanimation.zip"
          write_image "set_inode_field /media/bootanimation.zip mode 0100644"
          ensure_dir /etc/experience-ui
          cat > dist/metadata/BUILD_INFO.txt <<'INFO'
          Harmony Experience UI — experimental Android 12 GSI repack
          Base: Andy Yan LineageOS 19.1 GApps ARM64
          Included: Experience UI apps, updater metadata checker, generated boot animation
          OTA installation: not enabled; no signed OTA package is published
          Target architecture: ARM64
          Huawei Y9 2019 JKM-LX2 compatibility: unverified; not a device-specific ROM
          Do not flash until Treble/VNDK, vendor, bootloader, partition capacity, and restore method are verified.
          INFO
          write_image "write dist/metadata/BUILD_INFO.txt /etc/experience-ui/BUILD_INFO.txt"
          write_image "set_inode_field /etc/experience-ui/BUILD_INFO.txt mode 0100644"
          e2fsck -fn system.raw.img

      - name: Verify integrated files
        shell: bash
        run: |
          set -Eeuo pipefail
          debugfs -R 'ls -l /app' system.raw.img | tee dist/metadata/integrated-apps.txt
          debugfs -R 'stat /media/bootanimation.zip' system.raw.img > dist/metadata/integrated-bootanimation.txt
          debugfs -R 'stat /etc/experience-ui/BUILD_INFO.txt' system.raw.img > dist/metadata/integrated-build-info.txt
          grep -q ExperienceUpdater dist/metadata/integrated-apps.txt
          grep -q bootanimation.zip dist/metadata/integrated-bootanimation.txt
          grep -q 'Type: regular' dist/metadata/integrated-bootanimation.txt
          grep -q 'Type: regular' dist/metadata/integrated-build-info.txt
          for appdir in ExperienceLauncher ExperienceSettings ExperienceSetupWizard ExperienceDialer ExperienceMessages ExperienceContacts ExperienceNotes ExperienceClock ExperienceCalendar ExperienceCalculator ExperienceFiles ExperienceGallery ExperienceCamera ExperienceConverter ExperienceUpdater; do
            output="$(debugfs -R "stat /app/$appdir/$appdir.apk" system.raw.img 2>&1)"
            grep -q 'Type: regular' <<<"$output" || { echo "::error::Missing integrated APK: $appdir"; exit 1; }
          done
          e2fsck -fn system.raw.img

      - name: Android emulator APK smoke test
        shell: bash
        run: |
          set -Eeuo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME" -type f -path '*/cmdline-tools/*/bin/sdkmanager' -print -quit)"
          AVDMANAGER="$(find "$ANDROID_HOME" -type f -path '*/cmdline-tools/*/bin/avdmanager' -print -quit)"
          EMULATOR="$ANDROID_HOME/emulator/emulator"
          if [[ -z "$SDKMANAGER" || -z "$AVDMANAGER" || ! -x "$EMULATOR" ]]; then
            echo "::error::Android emulator tools unavailable"
            exit 1
          fi
          "$SDKMANAGER" "system-images;android-35;google_apis;x86_64"
          echo "no" | "$AVDMANAGER" create avd -n HarmonySmoke -k "system-images;android-35;google_apis;x86_64" -d pixel_2 --force
          nohup "$EMULATOR" -avd HarmonySmoke -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -accel off -wipe-data > emulator.log 2>&1 &
          EMULATOR_PID=$!
          cleanup() { adb emu kill >/dev/null 2>&1 || true; kill "$EMULATOR_PID" >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          adb start-server
          booted=false
          for i in $(seq 1 120); do
            if [[ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" == 1 ]]; then booted=true; break; fi
            sleep 2
          done
          if [[ "$booted" != true ]]; then cat emulator.log; echo "::error::Android emulator failed to boot"; exit 1; fi
          for apk in dist/apks/*.apk; do adb install -r "$apk"; done
          adb shell pm list packages | grep 'com\.experience\.' | tee dist/metadata/emulator-installed-packages.txt
          test -s dist/metadata/emulator-installed-packages.txt
          adb logcat -d -t 3000 > dist/metadata/emulator-logcat.txt
          echo "Passed: APK installation smoke test on Android 15 x86_64." > dist/metadata/EMULATOR-TEST.txt
          echo "This does NOT verify that the ARM64 GSI boots." >> dist/metadata/EMULATOR-TEST.txt

      - name: Package GSI and produce test report
        shell: bash
        run: |
          set -Eeuo pipefail
          e2fsck -fn system.raw.img
          mkdir -p dist/image
          cp --reflink=auto system.raw.img dist/image/ExperienceUI-Android12-arm64-experimental.img
          file dist/image/ExperienceUI-Android12-arm64-experimental.img | tee dist/metadata/output-image-file.txt
          qemu-img info dist/image/ExperienceUI-Android12-arm64-experimental.img | tee dist/metadata/qemu-image-info.txt
          sha256sum dist/image/ExperienceUI-Android12-arm64-experimental.img | tee dist/metadata/ExperienceUI-image.sha256
          cat > dist/metadata/TEST-REPORT.txt <<'REPORT'
          APK ZIP/signature/metadata checks: required to pass.
          Boot animation archive/frame/descriptor checks: required to pass.
          Filesystem checks before/after injection: required to pass.
          Embedded APK and boot animation paths: checked using debugfs.
          Android emulator: app installation smoke test on x86_64; not a GSI boot test.
          ARM64 GSI virtual-machine boot: NOT VERIFIED.
          Huawei Y9 JKM-LX2 hardware boot: NOT TESTED.
          OTA updater: metadata checker only; no download, signature verification, or install path is enabled.
          REPORT
          {
            echo "Build: experimental prebuilt GSI repack; not a full Android source build"
            echo "Base: Andy Yan LineageOS 19.1 Android 12 GApps ARM64"
            echo "Target architecture: arm64"
            echo "Harmony Experience UI Huawei-only dynamic app branding: not implemented in this workflow"
            echo "GSI boot: not verified"
            echo "Huawei Y9 JKM-LX2 compatibility: unconfirmed"
            echo "Do not flash without independent compatibility and partition-size verification."
          } > dist/metadata/BUILD-STATUS.txt

      - name: Upload GSI, APKs, boot animation, and diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: experience-ui-gsi-ubuntu-experimental
          path: dist/
          if-no-files-found: error
          retention-days: 14
