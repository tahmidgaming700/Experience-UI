name: Experience UI GSI Repack

on:
  workflow_dispatch:
    inputs:
      variant:
        description: "Andy Yan base GSI variant"
        required: true
        type: choice
        options:
          - vanilla
          - gapps
        default: vanilla
  push:
    paths:
      - ".github/workflows/experience-gsi-repack.yml"

permissions:
  contents: read

jobs:
  repack:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout Experience UI
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build Experience UI launcher
        run: |
          set -euxo pipefail
          gradle --no-daemon :launcher:assembleDebug
          test -s launcher/build/outputs/apk/debug/launcher-debug.apk
          mkdir -p out
          cp launcher/build/outputs/apk/debug/launcher-debug.apk out/ExperienceLauncher.apk

      - name: Generate Experience UI boot animation
        run: |
          set -euxo pipefail
          python3 -m pip install --user pillow
          python3 bootanimation/generate_bootanimation.py
          test -s bootanimation/bootanimation.zip
          cp bootanimation/bootanimation.zip out/bootanimation.zip

      - name: Install image tools
        run: |
          sudo apt-get update
          sudo apt-get install -y android-sdk-libsparse-utils e2fsprogs gzip wget file

      - name: Download Andy Yan base GSI
        env:
          VARIANT: ${{ github.event.inputs.variant || 'vanilla' }}
        run: |
          set -euxo pipefail
          DIR="lineage-21-pre-qpr2-td"
          if [ "$VARIANT" = "gapps" ]; then
            FILE="lineage-21.0-20260614-UNOFFICIAL-arm64_bgN-signed.img.gz"
          else
            FILE="lineage-21.0-20260614-UNOFFICIAL-arm64_bvN.img.gz"
          fi
          URL="https://sourceforge.net/projects/andyyan-gsi/files/$DIR/$FILE/download"
          wget --https-only --max-redirect=20 --tries=3 --timeout=60 -O base.img.gz "$URL"
          gzip -t base.img.gz
          gzip -dc base.img.gz > base.img
          file base.img
          sha256sum base.img | tee out/base-image.sha256

      - name: Expand and validate filesystem
        run: |
          set -euxo pipefail
          test -s base.img
          if file base.img | grep -qi 'Android sparse'; then
            simg2img base.img system.raw.img
          else
            cp --reflink=auto base.img system.raw.img
          fi
          file system.raw.img
          e2fsck -fn system.raw.img
          mkdir -p mountpoint
          sudo mount -o loop,rw system.raw.img mountpoint

      - name: Integrate Experience UI components
        env:
          VARIANT: ${{ github.event.inputs.variant || 'vanilla' }}
        run: |
          set -euxo pipefail
          sudo mkdir -p mountpoint/system/app/ExperienceLauncher
          sudo install -m 0644 out/ExperienceLauncher.apk mountpoint/system/app/ExperienceLauncher/ExperienceLauncher.apk
          sudo mkdir -p mountpoint/system/media
          sudo install -m 0644 out/bootanimation.zip mountpoint/system/media/bootanimation.zip
          sudo mkdir -p mountpoint/etc/experience-ui
          sudo tee mountpoint/etc/experience-ui/BUILD_INFO.txt >/dev/null <<EOF
          Experience UI experimental GSI repack
          Base: Andy Yan LineageOS GSI lineage-21.0-20260614
          Variant: $VARIANT
          Architecture: arm64
          Partition family: b (A/B / system-as-root GSI convention)
          Integrated components: Experience UI launcher APK and boot animation
          Not device-tested. Do not flash unless device compatibility is independently verified.
          EOF
          sudo sync
          sudo umount mountpoint
          e2fsck -fy system.raw.img
          resize2fs -M system.raw.img
          mv system.raw.img out/ExperienceUI-arm64-experimental.img
          file out/ExperienceUI-arm64-experimental.img
          sha256sum out/ExperienceUI-arm64-experimental.img | tee out/ExperienceUI.sha256

      - name: Publish experimental image artifact
        uses: actions/upload-artifact@v4
        with:
          name: experience-ui-gsi-experimental
          path: |
            out/ExperienceUI-arm64-experimental.img
            out/ExperienceUI.sha256
            out/base-image.sha256
            out/ExperienceLauncher.apk
            out/bootanimation.zip
          if-no-files-found: error
          retention-days: 7